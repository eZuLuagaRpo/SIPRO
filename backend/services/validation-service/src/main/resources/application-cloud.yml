# ============================================================================
# application-cloud.yml  —  Archivo AUTOSUFICIENTE para ambientes desplegados
#
# Levanta la app SOLO con este archivo (sin application.yml del JAR):
#   java -Duser.timezone=America/Bogota -jar sipro.jar \
#        --spring.config.location=file:/ruta/application-cloud.yml
#
# El pipeline de Azure DevOps corre "Replace Tokens" sobre este archivo
# antes del despliegue, reemplazando cada #{TOKEN}# con el valor del
# Variable Group del ambiente (DEV, QA o PDN).
#
# application-dev.yml  sigue existiendo solo para desarrollo local.
# ============================================================================

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: sipro-validation-service
  main:
    banner-mode: console
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
      connection.characterEncoding: utf-8
      hibernate.connection.charSet: utf-8
      hibernate.connection.useUnicode: true
  mail:
    host: ''
    port: 587
    username: ''
    password: ''
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true

security:
  ad:
    url: '#{AD_URL}#'
    domain: '#{AD_DOMAIN}#'
    groupsMapping: classpath:security/roles.yml

# Bloque app: unificado (evita que YAML descarte el primer bloque por clave duplicada)
app:
  validation:
    async:
      core-pool-size: 3
      max-pool-size: 6
      queue-capacity: 25

  cors:
    allowed-origins: '#{APP_CORS_ALLOWED_ORIGINS}#'

  storage:
    type: local
    local:
      base-dir: '#{APP_STORAGE_LOCAL_BASE_DIR}#'

  lz:
    schema: '#{APP_LZ_SCHEMA}#'
    tables:
      mdm: '#{APP_LZ_TABLE_MDM}#'

  mail:
    enabled: '#{APP_MAIL_ENABLED}#'
    transport: '#{APP_MAIL_TRANSPORT}#'
    from: '#{APP_MAIL_FROM}#'
    action-url: '#{APP_MAIL_ACTION_URL}#'
    banner-url: '#{APP_MAIL_BANNER_URL}#'
    ses:
      region: '#{APP_MAIL_SES_REGION}#'
      access-key: '#{APP_MAIL_SES_ACCESS_KEY}#'
      secret-key: '#{APP_MAIL_SES_SECRET_KEY}#'

sipro:
  excel:
    poi-byte-array-max-override: 250000000
  validation:
    cached-upload-ttl-minutes: 120
  admin:
    sql:
      max-select-rows: 200
      require-where-on-select: false
      require-where-on-update: true
      enabled-operations:
        - SELECT
        - UPDATE
        - INSERT
      allowed-tables:
        - data_validation_rule
        - productos
        - segmentos
        - sipro_lz_catalogo_tablas
        - sipro_lz_ingestion_run
        - sipro_lz_ingestion_run_default
        - sipro_lz_mdm_datos_generales_clientes
        - sipro_lz_mdm_datos_generales_clientes_default
        - sipro_lz_mdm_datos_generales_clientes_stg
        - sipro_lz_mdm_datos_generales_clientes_stg_default
        - sipro_parametros_columnas
        - sipro_parametros_columnas_creffsos
        - sipro_parametros_excepcionventanacarga
        - sipro_parametros_homologacion_colgaap
        - sipro_parametros_rango_habilitado
        - sipro_parametros_reglaventanacarga
        - sipro_parametros_tablas_lz
        - sipro_parametros_unico
        - sipro_resumen_por_moneda
      forbidden-tokens:
        - delete
        - truncate
        - drop
        - alter
        - create
        - grant
        - revoke
        - comment
        - copy
    logs:
      streaming-enabled: true
      download-enabled: true
      max-buffered-entries: 5000
      default-query-limit: 500
      max-query-limit: 5000
  param:
    AZURE_CLIENT_ID: '#{AZURE_CLIENT_ID}#'
    AZURE_TENANT_ID: '#{AZURE_TENANT_ID}#'
    AZURE_CLIENT_SECRET: '#{AZURE_CLIENT_SECRET}#'
    URL_DEV: '#{URL_DEV}#'
    URL_QA: '#{URL_QA}#'
    URL_PDN: '#{URL_PDN}#'
    banner-resource-path: classpath:static/email-assets/SIPRO_BannerCorreo.png
    outlook-powershell-path: powershell.exe
    log-preview: false

# Credenciales de BD principal — inyectadas por DbSecretsPostProcessor al arrancar
db:
  secrets:
    name: '#{DB_SECRETS_NAME}#'
    region: '#{DB_SECRETS_REGION}#'

lz:
  # Host tokenizado: DEV/QA usan 10.8.85.237, PDN usa impala.bancolombia.corp
  host: '#{LZ_HOST}#'
  port: '#{LZ_PORT}#'

  # Credenciales directas (bypass de Secrets Manager).
  # DEV/QA: llenar LZ_USER y LZ_PASSWORD en el Variable Group.
  # PDN: dejar LZ_USER y LZ_PASSWORD vacios → LzSecretsService usa el bloque secrets abajo.
  dev:
    user:     '#{LZ_USER}#'
    password: '#{LZ_PASSWORD}#'

  # Secrets Manager — necesario cuando LZ_USER/LZ_PASSWORD vienen vacios (PDN).
  # DEV/QA pueden dejarlo vacio si usan el bypass de credenciales directas.
  secrets:
    endpoint: '#{LZ_SECRETS_ENDPOINT}#'
    region:   '#{LZ_SECRETS_REGION}#'
    name:     '#{LZ_SECRETS_NAME}#'

  ssl:
    truststore-path:     '#{LZ_TRUSTSTORE_PATH}#'
    truststore-password: '#{LZ_TRUSTSTORE_PWD}#'
    truststore-type: JKS

  connect-timeout: 120
  socket-timeout: 1800

  ingestion:
    validate-on-startup: '#{LZ_VALIDATE_ON_STARTUP}#'
